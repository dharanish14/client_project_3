<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Register as a volunteer with NUNP (நம்ம ஊர் நம்ம பொறுப்பு). Connect. Share. Empower.">
  <title>NUNP — Register as a Volunteer</title>
  <meta name="theme-color" content="#132D4D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body data-page="volunteer-registration">
  <div data-site-header></div>
  <main>
    <section class="hero hero-dark">
      <div class="container center reveal" data-aos="fade-up">
        <div class="eyebrow">Volunteer Network</div>
        <h1>Become a Volunteer</h1>
        <p class="lead">Complete your registration to start organizing local projects, improving neighborhoods, and building public space campaigns.</p>
      </div>
    </section>

    <section class="section">
      <div class="container" style="max-width: 720px; margin: 0 auto;">
        <div id="volunteer-form-container">
          <!-- Dynamically populated via site.js renderVolunteerPageContent() depending on verification status -->
        </div>
      </div>
    </section>
  </main>
  <div data-site-footer></div>
  
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/countup.js/2.8.0/countUp.umd.min.js"></script>
  <script src="/assets/js/config.js"></script>
  <script src="/assets/js/site.js"></script>
</body>
</html>
