<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NUNP Admin Portal — Citizen-led community movement dashboard.">
  <title>NUNP Admin Portal</title>
  <meta name="theme-color" content="#132D4D">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/aos@2.3.4/dist/aos.css">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .admin-body {
      background: var(--soft-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Auth screen container */
    .login-container {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-grow: 1;
      padding: 40px 20px;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 40px 32px;
      background: #ffffff;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(19, 45, 77, 0.1);
      box-shadow: var(--shadow-strong);
      text-align: center;
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      object-fit: contain;
    }

    .login-title {
      font-size: 1.8rem;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .login-subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #ef4444;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 8px;
      justify-content: center;
    }

    /* Dashboard view style */
    .dashboard-container {
      display: none;
      flex-direction: column;
      flex-grow: 1;
    }

    .dashboard-header {
      background: #ffffff;
      border-bottom: 1px solid rgba(19, 45, 77, 0.08);
      padding: 16px 0;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .dashboard-header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .admin-user-badge {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .admin-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(59, 162, 160, 0.15);
      border: 2px solid var(--teal);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--teal);
      font-weight: 700;
    }

    .admin-details {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .admin-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--navy);
    }

    .admin-role {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .dashboard-main {
      padding: 40px 0;
      flex-grow: 1;
    }

    /* Dashboard Metric Cards */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 32px;
    }

    .metric-card {
      background: #ffffff;
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(19, 45, 77, 0.06);
      box-shadow: var(--shadow);
      display: flex;
      align-items: center;
      gap: 20px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .metric-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-strong);
    }

    .metric-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .metric-icon.teal {
      background: rgba(59, 162, 160, 0.1);
      color: var(--teal);
    }

    .metric-icon.navy {
      background: rgba(19, 45, 77, 0.08);
      color: var(--navy);
    }

    .metric-icon.blue {
      background: rgba(172, 189, 198, 0.15);
      color: #1a3f6b;
    }

    .metric-info {
      display: flex;
      flex-direction: column;
    }

    .metric-value {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
    }

    .metric-label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Tab Switcher Styles */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      border-bottom: 2px solid rgba(19, 45, 77, 0.08);
      padding-bottom: 12px;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      font-size: 0.95rem;
      border: 1px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--navy);
      background: rgba(19, 45, 77, 0.04);
    }

    .tab-btn.active {
      background: var(--navy);
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(19, 45, 77, 0.15);
    }

    /* Filters and search panel */
    .controls-panel {
      background: #ffffff;
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px solid rgba(19, 45, 77, 0.06);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 16px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .controls-panel {
        grid-template-columns: 1fr;
      }
    }

    .search-wrapper {
      position: relative;
    }

    .search-wrapper input {
      padding-left: 44px;
      border-radius: 12px;
      height: 48px;
    }

    .search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .filter-select {
      height: 48px;
      border: 1px solid rgba(19, 45, 77, 0.14);
      border-radius: 12px;
      padding: 0 16px;
      background: #ffffff;
      color: var(--navy);
      font-weight: 500;
      min-width: 160px;
      cursor: pointer;
      outline: none;
    }

    .filter-select:focus {
      border-color: var(--teal);
    }

    /* Table & Card layout for volunteers */
    .table-container {
      background: #ffffff;
      border-radius: var(--radius-md);
      border: 1px solid rgba(19, 45, 77, 0.06);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .volunteers-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .volunteers-table th {
      background: var(--soft-bg);
      color: var(--navy);
      font-weight: 700;
      padding: 16px 20px;
      font-size: 0.9rem;
      border-bottom: 1px solid rgba(19, 45, 77, 0.08);
      letter-spacing: 0.03em;
    }

    .volunteers-table td {
      padding: 18px 20px;
      border-bottom: 1px solid rgba(19, 45, 77, 0.06);
      font-size: 0.92rem;
      color: var(--navy);
      vertical-align: middle;
    }

    .volunteers-table tr:last-child td {
      border-bottom: none;
    }

    .volunteers-table tr:hover td {
      background: rgba(59, 162, 160, 0.02);
    }

    .volunteer-id-badge {
      font-weight: 700;
      font-size: 0.8rem;
      color: var(--teal);
      background: rgba(59, 162, 160, 0.09);
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .volunteer-role-badge {
      font-weight: 600;
      font-size: 0.82rem;
      color: var(--navy);
      background: rgba(19, 45, 77, 0.06);
      padding: 4px 10px;
      border-radius: 20px;
      display: inline-block;
    }

    .volunteer-contact-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .volunteer-email {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .volunteer-message-text {
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--muted);
      cursor: pointer;
    }

    .volunteer-message-text:hover {
      text-decoration: underline;
      color: var(--teal);
    }

    .btn-action {
      padding: 8px 12px;
      font-size: 0.82rem;
      border-radius: 8px;
      font-weight: 600;
    }

    .btn-delete {
      color: #ef4444;
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.12);
      transition: background 0.2s, color 0.2s;
    }

    .btn-delete:hover {
      background: #ef4444;
      color: #ffffff;
    }

    /* Modal for View Details */
    .detail-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(19, 45, 77, 0.5);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .detail-modal-overlay.is-open {
      opacity: 1;
      pointer-events: auto;
    }

    .detail-modal {
      background: #ffffff;
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 580px;
      box-shadow: var(--shadow-strong);
      overflow: hidden;
      transform: translateY(20px);
      transition: transform 0.3s ease;
    }

    .detail-modal-overlay.is-open .detail-modal {
      transform: translateY(0);
    }

    .detail-modal-header {
      background: var(--navy);
      color: #ffffff;
      padding: 24px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .detail-modal-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      margin: 0;
    }

    .detail-modal-close {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 50%;
      transition: background 0.2s, color 0.2s;
    }

    .detail-modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    .detail-modal-body {
      padding: 30px;
      display: grid;
      gap: 20px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    .detail-value {
      font-size: 1rem;
      font-weight: 600;
      color: var(--navy);
    }

    .detail-item.full-width {
      grid-column: span 2;
    }

    .detail-message-box {
      background: var(--soft-bg);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid rgba(19, 45, 77, 0.08);
      font-size: 0.95rem;
      color: var(--navy);
      line-height: 1.6;
      max-height: 160px;
      overflow-y: auto;
    }

    .empty-state {
      padding: 60px 20px;
      text-align: center;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 3rem;
      color: var(--light-blue-gray);
      margin-bottom: 16px;
    }

    .empty-state-text {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 8px;
    }
  </style>
</head>
<body class="admin-body">

  <!-- AUTHENTICATION SCREEN -->
  <div class="login-container" id="auth-screen">
    <div class="login-card" data-aos="zoom-in">
      <img src="/NUNP_Logo.png" alt="NUNP Logo" class="login-logo" onerror="this.src='https://raw.githubusercontent.com/dharanish14/client_project_3/main/NUNP_Logo.png';">
      <h2 class="login-title">NUNP Portal</h2>
      <p class="login-subtitle">Sign in to manage community volunteers</p>
      
      <div class="alert-error" id="login-error">
        <i data-lucide="alert-circle" style="width: 18px; height: 18px;"></i>
        <span>Invalid email or password.</span>
      </div>

      <form id="login-form" class="form-grid">
        <div class="field" style="text-align: left;">
          <label for="email">Admin Email</label>
          <input type="email" id="email" required placeholder="admin@nunp.org">
        </div>
        <div class="field" style="text-align: left;">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 12px; width: 100%; justify-content: center;">Log In</button>
      </form>
    </div>
  </div>

  <!-- DASHBOARD PORTAL SCREEN -->
  <div class="dashboard-container" id="dashboard-screen">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="container dashboard-header-inner">
        <a class="brand" href="/" aria-label="NUNP home">
          <img class="brand-logo" src="/NUNP_Logo.png" alt="NUNP logo" onerror="this.src='https://raw.githubusercontent.com/dharanish14/client_project_3/main/NUNP_Logo.png';">
          <span class="brand-copy">
            <span class="brand-wordmark">NUNP</span>
            <span class="brand-tagline">Admin Dashboard</span>
          </span>
        </a>

        <div style="display: flex; align-items: center; gap: 24px;">
          <div class="admin-user-badge">
            <div class="admin-avatar">AD</div>
            <div class="admin-details">
              <span class="admin-name">NUNP Admin</span>
              <span class="admin-role">nunp.chennai@gmail.com</span>
            </div>
          </div>
          <button class="btn btn-secondary btn-action" id="btn-logout" style="padding: 10px 18px;">
            <i data-lucide="log-out" style="width: 16px; height: 16px;"></i> Logout
          </button>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="dashboard-main">
      <div class="container">
        
        <!-- Metrics -->
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-icon teal">
              <i data-lucide="compass" style="width: 24px; height: 24px;"></i>
            </div>
            <div class="metric-info">
              <span class="metric-value" id="stat-joins-total">0</span>
              <span class="metric-label">Join Movement Submissions</span>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon navy">
              <i data-lucide="users" style="width: 24px; height: 24px;"></i>
            </div>
            <div class="metric-info">
              <span class="metric-value" id="stat-volunteers-total">0</span>
              <span class="metric-label">Volunteer Registrations</span>
            </div>
          </div>

          <div class="metric-card">
            <div class="metric-icon blue">
              <i data-lucide="map-pin" style="width: 24px; height: 24px;"></i>
            </div>
            <div class="metric-info">
              <span class="metric-value" id="stat-combined-areas">0</span>
              <span class="metric-label">Total Areas Covered</span>
            </div>
          </div>
        </div>

        <!-- Tabs Switcher -->
        <div class="tab-bar">
          <button class="tab-btn" id="tab-joins" data-tab="joins">
            <i data-lucide="compass" style="width: 18px; height: 18px;"></i> Join the Movement
          </button>
          <button class="tab-btn active" id="tab-volunteers" data-tab="volunteers">
            <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i> Become a Volunteer
          </button>
        </div>

        <!-- Controls panel -->
        <div class="controls-panel">
          <div class="search-wrapper">
            <i data-lucide="search" class="search-icon" style="width: 18px; height: 18px;"></i>
            <input type="text" id="search-input" placeholder="Search by name, email, city...">
          </div>

          <div>
            <select id="filter-secondary" class="filter-select">
              <option value="">All Roles</option>
            </select>
          </div>

          <div>
            <select id="filter-city" class="filter-select">
              <option value="">All Areas</option>
            </select>
          </div>

          <div style="display: flex; gap: 8px;">
            <button class="btn btn-secondary btn-action" id="btn-export-csv" style="padding: 12px 18px; background: #fff;">
              <i data-lucide="download" style="width: 16px; height: 16px;"></i> CSV
            </button>
            <button class="btn btn-secondary btn-action" id="btn-export-json" style="padding: 12px 18px; background: #fff;">
              <i data-lucide="file-json" style="width: 16px; height: 16px;"></i> JSON
            </button>
          </div>
        </div>

        <!-- Table -->
        <div class="table-container">
          <table class="volunteers-table" id="volunteers-table">
            <thead id="table-head">
              <!-- Dynamically populated headers based on tab -->
            </thead>
            <tbody id="table-body">
              <!-- Dynamically populated rows -->
            </tbody>
          </table>
          <div class="empty-state" id="empty-state" style="display: none;">
            <div class="empty-state-icon">
              <i data-lucide="folder-open"></i>
            </div>
            <div class="empty-state-text">No submissions found</div>
            <p style="margin: 0; font-size: 0.9rem;">Try adjusting your filters or search query.</p>
          </div>
        </div>

      </div>
    </main>
  </div>

  <!-- DETAILS MODAL -->
  <div class="detail-modal-overlay" id="detail-modal">
    <div class="detail-modal">
      <div class="detail-modal-header">
        <h3 class="detail-modal-title" id="m-title">Submission Profile</h3>
        <button class="detail-modal-close" id="modal-close-btn" aria-label="Close modal">
          <i data-lucide="x" style="width: 20px; height: 20px;"></i>
        </button>
      </div>
      <div class="detail-modal-body" id="m-body">
        <!-- Dynamically populated details depending on card type -->
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
  <script src="/assets/js/config.js"></script>
  
  <script>
    // DOM Elements
    const authScreen = document.getElementById('auth-screen');
    const dashboardScreen = document.getElementById('dashboard-screen');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const btnLogout = document.getElementById('btn-logout');
    
    const statJoinsTotal = document.getElementById('stat-joins-total');
    const statVolunteersTotal = document.getElementById('stat-volunteers-total');
    const statCombinedAreas = document.getElementById('stat-combined-areas');
    
    const searchInput = document.getElementById('search-input');
    const filterSecondary = document.getElementById('filter-secondary');
    const filterCity = document.getElementById('filter-city');
    const tableHead = document.getElementById('table-head');
    const tableBody = document.getElementById('table-body');
    const emptyState = document.getElementById('empty-state');
    const volunteersTable = document.getElementById('volunteers-table');
    
    const btnExportCsv = document.getElementById('btn-export-csv');
    const btnExportJson = document.getElementById('btn-export-json');
    const tabBtns = document.querySelectorAll('.tab-btn');
    
    // Modal Elements
    const detailModal = document.getElementById('detail-modal');
    const modalCloseBtn = document.getElementById('modal-close-btn');

    // Admin Credentials
    const ADMIN_EMAIL = 'nunp.chennai@gmail.com';
    const ADMIN_PASSWORD = 'nunp.chennai123@';

    let joinsDataset = [];
    let volunteersDataset = [];
    let activeTab = 'volunteers'; // 'joins' or 'volunteers'

    // Helper to convert Google Drive viewer link into a direct download/render link
    function getDirectImageUrl(url) {
      if (!url) return '';
      if (!url.includes('drive.google.com')) return url;
      
      let fileId = '';
      const fileDMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
      if (fileDMatch && fileDMatch[1]) {
        fileId = fileDMatch[1];
      } else {
        const idParamMatch = url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        if (idParamMatch && idParamMatch[1]) {
          fileId = idParamMatch[1];
        }
      }
      return fileId ? `https://lh3.googleusercontent.com/d/${fileId}` : url;
    }

    // Check auth status
    function checkAuth() {
      if (sessionStorage.getItem('nunp_admin_logged_in') === 'true') {
        showDashboard();
      } else {
        showLogin();
      }
    }

    function showLogin() {
      authScreen.style.display = 'flex';
      dashboardScreen.style.display = 'none';
      if (window.lucide) window.lucide.createIcons();
    }

    function showDashboard() {
      authScreen.style.display = 'none';
      dashboardScreen.style.display = 'flex';
      loadData();
      if (window.lucide) window.lucide.createIcons();
    }

    // Load data from localStorage and fetch live data from Google Sheets
    async function loadData() {
      // Load local joins data
      joinsDataset = JSON.parse(localStorage.getItem('nunp_joins') || '[]');
      joinsDataset = joinsDataset.filter(j => j.id && !j.id.startsWith('JOIN-00010'));
      
      // Default local volunteers data
      volunteersDataset = JSON.parse(localStorage.getItem('nunp_volunteers') || '[]');
      volunteersDataset = volunteersDataset.filter(v => v.id && !v.id.startsWith('VOL-00010'));
      
      const endpoint = window.NUNP_FORM_ENDPOINTS ? window.NUNP_FORM_ENDPOINTS.volunteer : '';
      if (endpoint && endpoint.includes('script.google.com')) {
        try {
          const response = await fetch(endpoint);
          if (response.ok) {
            const liveVolunteers = await response.json();
            
            if (Array.isArray(liveVolunteers)) {
              // Map columns: Timestamp, Volunteer ID, Name, Phone, Email, Area / Locality, Profession, Availability, Photo Link
              volunteersDataset = liveVolunteers.map((row, idx) => {
                let formattedDate = '';
                if (row.Timestamp) {
                  const dateObj = new Date(row.Timestamp);
                  if (!isNaN(dateObj)) {
                    formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                  }
                }
                
                return {
                  id: row["Volunteer ID"] || `VOL-live-${idx}`,
                  name: row["Name"] || 'Unknown',
                  phone: row["Phone"] || '',
                  email: row["Email"] || '',
                  area: row["Area / Locality"] || '',
                  profession: row["Profession"] || '',
                  availability: row["Availability"] || 'Weekends',
                  photo: row["Photo Link"] && row["Photo Link"] !== 'No Photo' ? row["Photo Link"] : '',
                  date: formattedDate || 'N/A'
                };
              });
            }
          }
        } catch (error) {
          console.error('Error loading live data from Google Sheet:', error);
        }
      }

      const joinEndpoint = window.NUNP_FORM_ENDPOINTS ? window.NUNP_FORM_ENDPOINTS.join : '';
      if (joinEndpoint && joinEndpoint.includes('script.google.com')) {
        try {
          const response = await fetch(joinEndpoint);
          if (response.ok) {
            const liveJoins = await response.json();
            if (Array.isArray(liveJoins)) {
              joinsDataset = liveJoins.map((row, idx) => {
                let formattedDate = '';
                if (row.Timestamp) {
                  const dateObj = new Date(row.Timestamp);
                  if (!isNaN(dateObj)) {
                    formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                  }
                }
                
                return {
                  id: row["Join ID"] || `JOIN-live-${idx}`,
                  name: row["Name"] || 'Unknown',
                  phone: row["Phone"] || '',
                  email: row["Email"] || '',
                  city: row["City / Area"] || '',
                  role: row["Role"] || 'Volunteer',
                  message: row["Message"] || '',
                  date: formattedDate || 'N/A'
                };
              });
            }
          }
        } catch (error) {
          console.error('Error loading live joins from Google Sheet:', error);
        }
      }
      
      updateStatsCounters();
      populateFilters();
      renderTable();
    }

    // Update the metrics stats cards
    function updateStatsCounters() {
      statJoinsTotal.textContent = joinsDataset.length;
      statVolunteersTotal.textContent = volunteersDataset.length;
      
      // Combined unique areas covered
      const joinsAreas = joinsDataset.map(j => j.city?.toLowerCase()?.trim()).filter(Boolean);
      const volsAreas = volunteersDataset.map(v => v.area?.toLowerCase()?.trim()).filter(Boolean);
      const combined = new Set([...joinsAreas, ...volsAreas]);
      statCombinedAreas.textContent = combined.size;
    }

    // Populate roles/availability and cities filters dynamically
    function populateFilters() {
      const cities = new Set();
      const currentCity = filterCity.value;
      const currentSecondary = filterSecondary.value;

      if (activeTab === 'joins') {
        // Populating roles dropdown
        const roles = new Set();
        joinsDataset.forEach(j => {
          if (j.role) roles.add(j.role);
          if (j.city) cities.add(j.city);
        });

        filterSecondary.innerHTML = '<option value="">All Roles</option>';
        roles.forEach(role => {
          const option = document.createElement('option');
          option.value = role;
          option.textContent = role;
          filterSecondary.appendChild(option);
        });
      } else {
        // Populating availabilities dropdown
        const availabilities = new Set();
        volunteersDataset.forEach(v => {
          if (v.availability) availabilities.add(v.availability);
          if (v.area) cities.add(v.area);
        });

        filterSecondary.innerHTML = '<option value="">All Availabilities</option>';
        availabilities.forEach(av => {
          const option = document.createElement('option');
          option.value = av;
          option.textContent = av;
          filterSecondary.appendChild(option);
        });
      }

      filterCity.innerHTML = '<option value="">All Areas</option>';
      cities.forEach(city => {
        const option = document.createElement('option');
        option.value = city;
        option.textContent = city;
        filterCity.appendChild(option);
      });

      // Restore values if still available
      filterCity.value = currentCity;
      filterSecondary.value = currentSecondary;
    }

    // Render active tab table list based on search and filters
    function renderTable() {
      const search = searchInput.value.toLowerCase().trim();
      const selectedSecondary = filterSecondary.value;
      const selectedCity = filterCity.value;

      let filteredData = [];

      if (activeTab === 'joins') {
        tableHead.innerHTML = `
          <tr>
            <th>Photo</th>
            <th>ID</th>
            <th>Name</th>
            <th>Contact Info</th>
            <th>City / Area</th>
            <th>Role</th>
            <th>Message</th>
            <th>Join Date</th>
          </tr>
        `;

        filteredData = joinsDataset.filter(j => {
          const matchesSearch = 
            j.name?.toLowerCase().includes(search) ||
            j.email?.toLowerCase().includes(search) ||
            j.phone?.includes(search) ||
            j.city?.toLowerCase().includes(search) ||
            j.id?.toLowerCase().includes(search);
          const matchesRole = !selectedSecondary || j.role === selectedSecondary;
          const matchesCity = !selectedCity || j.city === selectedCity;
          return matchesSearch && matchesRole && matchesCity;
        });
      } else {
        tableHead.innerHTML = `
          <tr>
            <th>Photo</th>
            <th>ID</th>
            <th>Name</th>
            <th>Contact Info</th>
            <th>Area / Locality</th>
            <th>Profession</th>
            <th>Availability</th>
            <th>Reg Date</th>
          </tr>
        `;

        filteredData = volunteersDataset.filter(v => {
          const matchesSearch = 
            v.name?.toLowerCase().includes(search) ||
            v.email?.toLowerCase().includes(search) ||
            v.phone?.includes(search) ||
            v.area?.toLowerCase().includes(search) ||
            v.profession?.toLowerCase().includes(search) ||
            v.skills?.toLowerCase().includes(search) ||
            v.id?.toLowerCase().includes(search);
          const matchesAvail = !selectedSecondary || v.availability === selectedSecondary;
          const matchesArea = !selectedCity || v.area === selectedCity;
          return matchesSearch && matchesAvail && matchesArea;
        });
      }

      tableBody.innerHTML = '';

      if (filteredData.length === 0) {
        volunteersTable.style.display = 'none';
        emptyState.style.display = 'block';
      } else {
        volunteersTable.style.display = 'table';
        emptyState.style.display = 'none';

        filteredData.forEach(row => {
          const tr = document.createElement('tr');
          
          if (activeTab === 'joins') {
            tr.innerHTML = `
              <td>
                ${row.photo ? `
                  <img src="${getDirectImageUrl(row.photo)}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(19,45,77,0.15);">
                ` : `
                  <div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(19,45,77,0.06); display: flex; align-items: center; justify-content: center; color: var(--muted);">
                    <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                  </div>
                `}
              </td>
              <td><span class="volunteer-id-badge">${row.id || ''}</span></td>
              <td style="font-weight: 600; cursor: pointer;" class="trigger-modal-name">${row.name || ''}</td>
              <td>
                <div class="volunteer-contact-info">
                  <span>${row.phone || ''}</span>
                  <span class="volunteer-email">${row.email || ''}</span>
                </div>
              </td>
              <td>${row.city || ''}</td>
              <td><span class="volunteer-role-badge" style="background: rgba(59, 162, 160, 0.08); color: var(--teal);">${row.role || 'Volunteer'}</span></td>
              <td>
                <div class="volunteer-message-text" title="Click to view message">${row.message || 'No message'}</div>
              </td>
              <td>${row.date || ''}</td>
            `;
          } else {
            tr.innerHTML = `
              <td>
                ${row.photo ? `
                  <img src="${getDirectImageUrl(row.photo)}" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(19,45,77,0.15);">
                ` : `
                  <div style="width: 40px; height: 40px; border-radius: 50%; background: rgba(19,45,77,0.06); display: flex; align-items: center; justify-content: center; color: var(--muted);">
                    <i data-lucide="user" style="width: 18px; height: 18px;"></i>
                  </div>
                `}
              </td>
              <td><span class="volunteer-id-badge" style="background: rgba(26,63,107,0.08); color: var(--navy);">${row.id || ''}</span></td>
              <td style="font-weight: 600; cursor: pointer;" class="trigger-modal-name">${row.name || ''}</td>
              <td>
                <div class="volunteer-contact-info">
                  <span>${row.phone || ''}</span>
                  <span class="volunteer-email">${row.email || ''}</span>
                </div>
              </td>
              <td>${row.area || ''}</td>
              <td>${row.profession || 'N/A'}</td>
              <td><span class="volunteer-role-badge">${row.availability || 'Weekends'}</span></td>
              <td>${row.date || ''}</td>
            `;
          }

          // Trigger modals on text click or name click
          tr.querySelector('.trigger-modal-name').addEventListener('click', () => openModal(row));
          
          const msgText = tr.querySelector('.volunteer-message-text');
          if (msgText) {
            msgText.addEventListener('click', () => openModal(row));
          }

          tableBody.appendChild(tr);
        });
      }

      if (window.lucide) window.lucide.createIcons();
    }

    // Delete submission row
    function deleteItem(id) {
      if (activeTab === 'joins') {
        joinsDataset = joinsDataset.filter(j => j.id !== id);
        localStorage.setItem('nunp_joins', JSON.stringify(joinsDataset));
      } else {
        volunteersDataset = volunteersDataset.filter(v => v.id !== id);
        localStorage.setItem('nunp_volunteers', JSON.stringify(volunteersDataset));
      }
      updateStatsCounters();
      populateFilters();
      renderTable();
    }

    // Open Detail Modal
    function openModal(row) {
      const modalBody = document.getElementById('m-body');
      
      if (activeTab === 'joins') {
        document.getElementById('m-title').textContent = "Join Movement Request Details";
        modalBody.innerHTML = `
          <div class="detail-grid">
            <div class="detail-item full-width" style="display: flex; justify-content: center; margin-bottom: 15px;">
              ${row.photo ? `
                <img src="${getDirectImageUrl(row.photo)}" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--teal); box-shadow: var(--shadow-strong);">
              ` : `
                <div style="width: 120px; height: 120px; border-radius: 50%; background: rgba(59, 162, 160, 0.08); border: 2px dashed var(--teal); display: flex; align-items: center; justify-content: center; color: var(--teal);">
                  <i data-lucide="user" style="width: 48px; height: 48px;"></i>
                </div>
              `}
            </div>
            <div class="detail-item">
              <span class="detail-label">Join ID</span>
              <span class="detail-value" style="color: var(--teal); font-weight: 700;">${row.id || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Join Date</span>
              <span class="detail-value">${row.date || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Full Name</span>
              <span class="detail-value">${row.name || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Selected Role</span>
              <span class="detail-value">${row.role || 'Volunteer'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Email Address</span>
              <span class="detail-value">${row.email || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Phone Number</span>
              <span class="detail-value">${row.phone || ''}</span>
            </div>
            <div class="detail-item full-width">
              <span class="detail-label">City / Area</span>
              <span class="detail-value">${row.city || ''}</span>
            </div>
            <div class="detail-item full-width">
              <span class="detail-label">Intro Message</span>
              <div class="detail-message-box">${row.message || 'No intro message provided.'}</div>
            </div>
          </div>
        `;
      } else {
        document.getElementById('m-title').textContent = "Volunteer Registration Details";
        modalBody.innerHTML = `
          <div class="detail-grid">
            <div class="detail-item full-width" style="display: flex; justify-content: center; margin-bottom: 15px;">
              ${row.photo ? `
                <img src="${getDirectImageUrl(row.photo)}" style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--navy); box-shadow: var(--shadow-strong);">
              ` : `
                <div style="width: 120px; height: 120px; border-radius: 50%; background: rgba(19, 45, 77, 0.08); border: 2px dashed var(--navy); display: flex; align-items: center; justify-content: center; color: var(--navy);">
                  <i data-lucide="user" style="width: 48px; height: 48px;"></i>
                </div>
              `}
            </div>
            <div class="detail-item">
              <span class="detail-label">Volunteer ID</span>
              <span class="detail-value" style="color: var(--navy); font-weight: 700;">${row.id || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Registration Date</span>
              <span class="detail-value">${row.date || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Full Name</span>
              <span class="detail-value">${row.name || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Profession</span>
              <span class="detail-value">${row.profession || 'N/A'}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Email Address</span>
              <span class="detail-value">${row.email || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Phone Number</span>
              <span class="detail-value">${row.phone || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Area / Locality</span>
              <span class="detail-value">${row.area || ''}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Availability</span>
              <span class="detail-value">${row.availability || 'Weekends'}</span>
            </div>
          </div>
        `;
      }
      
      detailModal.classList.add('is-open');
      if (window.lucide) window.lucide.createIcons();
    }

    // Close Detail Modal
    function closeModal() {
      detailModal.classList.remove('is-open');
    }

    // Export Active Tab Dataset as CSV
    function exportCSV() {
      const activeDataset = activeTab === 'joins' ? joinsDataset : volunteersDataset;
      if (activeDataset.length === 0) return alert('No submission data to export.');

      let csvContent = "data:text/csv;charset=utf-8,";

      if (activeTab === 'joins') {
        const headers = ['ID', 'Name', 'Email', 'Phone', 'City / Area', 'Role', 'Message', 'Join Date'];
        const rows = activeDataset.map(j => [
          j.id || '',
          `"${(j.name || '').replace(/"/g, '""')}"`,
          j.email || '',
          j.phone || '',
          `"${(j.city || '').replace(/"/g, '""')}"`,
          `"${(j.role || '').replace(/"/g, '""')}"`,
          `"${(j.message || '').replace(/"/g, '""')}"`,
          j.date || ''
        ]);
        csvContent += [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      } else {
        const headers = ['ID', 'Name', 'Email', 'Phone', 'Area / Locality', 'Profession', 'Availability', 'Skills', 'Reg Date'];
        const rows = activeDataset.map(v => [
          v.id || '',
          `"${(v.name || '').replace(/"/g, '""')}"`,
          v.email || '',
          v.phone || '',
          `"${(v.area || '').replace(/"/g, '""')}"`,
          `"${(v.profession || '').replace(/"/g, '""')}"`,
          `"${(v.availability || '').replace(/"/g, '""')}"`,
          `"${(v.skills || '').replace(/"/g, '""')}"`,
          v.date || ''
        ]);
        csvContent += [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
      }

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `nunp_${activeTab}_export_${new Date().toISOString().split('T')[0]}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Export Active Tab Dataset as JSON
    function exportJSON() {
      const activeDataset = activeTab === 'joins' ? joinsDataset : volunteersDataset;
      if (activeDataset.length === 0) return alert('No submission data to export.');

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(activeDataset, null, 2));
      const link = document.createElement("a");
      link.setAttribute("href", dataStr);
      link.setAttribute("download", `nunp_${activeTab}_export_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Tab switcher handler
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        
        // Reset controls
        searchInput.value = '';
        filterSecondary.value = '';
        filterCity.value = '';

        // Render layout
        populateFilters();
        renderTable();
      });
    });

    // Event Listeners
    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      if (email === ADMIN_EMAIL && password === ADMIN_PASSWORD) {
        sessionStorage.setItem('nunp_admin_logged_in', 'true');
        loginError.style.display = 'none';
        loginForm.reset();
        showDashboard();
      } else {
        loginError.style.display = 'flex';
      }
    });

    btnLogout.addEventListener('click', () => {
      sessionStorage.removeItem('nunp_admin_logged_in');
      showLogin();
    });

    modalCloseBtn.addEventListener('click', closeModal);
    detailModal.addEventListener('click', (e) => {
      if (e.target === detailModal) closeModal();
    });

    // Filters and Searching change listeners
    searchInput.addEventListener('input', renderTable);
    filterSecondary.addEventListener('change', renderTable);
    filterCity.addEventListener('change', renderTable);

    // Export Handlers
    btnExportCsv.addEventListener('click', exportCSV);
    btnExportJson.addEventListener('click', exportJSON);

    // Initial check
    document.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      if (window.AOS) window.AOS.init({ once: true, duration: 600 });
    });
  </script>
</body>
</html>
